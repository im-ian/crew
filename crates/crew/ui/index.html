<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Crew</title>
    <!-- A phone opening Crew over the tailnet can add it to the home screen. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#19191b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Crew" />
    <!-- The home screen app draws under the status bar, in the app's own
         colour; the safe-area padding keeps everything clear of it. With
         "default" iOS cut the status bar's strip out and painted it apart. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("crew.theme") || "dark";
          var resolved = t;
          if (t === "system") {
            resolved = matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          }
          if (t === "glass") document.documentElement.dataset.glass = "";
          if (resolved !== "light" && resolved !== "dark") resolved = "dark";
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
          // Safari's bar takes the theme's colour from the first paint on.
          var bar = document.querySelector('meta[name="theme-color"]');
          if (bar) bar.setAttribute("content", resolved === "light" ? "#ffffff" : "#19191b");
          var loc = localStorage.getItem("crew.locale") || "ko";
          document.documentElement.lang = loc === "en" ? "en" : "ko";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
