<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Crew</title>
  <style>
    html, body {
      margin: 0;
      width: 1600px;
      height: 480px;
      overflow: hidden;
      background: #1a1f36;
      color: #f4f4f8;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
        "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .stage {
      position: relative;
      width: 1600px;
      height: 480px;
      background:
        radial-gradient(ellipse 42% 58% at 22% 48%, rgba(255, 90, 90, 0.22), transparent 62%),
        radial-gradient(ellipse 38% 52% at 78% 38%, rgba(155, 125, 255, 0.20), transparent 58%),
        radial-gradient(ellipse 36% 44% at 58% 88%, rgba(46, 196, 182, 0.16), transparent 55%),
        radial-gradient(ellipse 28% 36% at 70% 70%, rgba(20, 195, 142, 0.12), transparent 50%),
        #1a1f36;
    }
    .icon {
      position: absolute;
      left: 200px;
      top: 96px;
      width: 288px;
      height: 288px;
      border-radius: 66px;
      box-shadow:
        0 28px 56px rgba(0, 0, 0, 0.45),
        0 0 0 1px rgba(255, 255, 255, 0.06);
    }
    .copy {
      position: absolute;
      left: 560px;
      top: 156px;
      width: 820px;
    }
    .mark {
      margin: 0;
      font-size: 100px;
      font-weight: 700;
      letter-spacing: -0.06em;
      line-height: 0.92;
    }
    .tag {
      margin: 24px 0 0;
      font-size: 32px;
      font-weight: 500;
      letter-spacing: -0.03em;
      color: rgba(244, 244, 248, 0.86);
      line-height: 1.25;
    }
  </style>
</head>
<body>
  <div class="stage">
    <img class="icon" src="../../crates/crew/icons/icon.png" alt="" />
    <div class="copy">
      <p class="mark">Crew</p>
      <p class="tag">로컬에서 돌아가는 멀티 에이전트 데스크톱</p>
    </div>
  </div>
</body>
</html>
