<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Crew — 새 봇</title>
  <link rel="stylesheet" href="../../crates/crew/ui/src/styles.css" />
  <style>
    html, body {
      margin: 0;
      width: 1280px;
      height: 860px;
      overflow: hidden;
      background:
        radial-gradient(ellipse 50% 60% at 20% 40%, rgba(255, 90, 90, 0.14), transparent 60%),
        radial-gradient(ellipse 40% 50% at 80% 70%, rgba(155, 125, 255, 0.12), transparent 55%),
        #12151f;
    }
    .stage {
      width: 1280px;
      height: 860px;
      display: grid;
      place-items: center;
    }
    .window {
      width: 1120px;
      height: 740px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow:
        0 40px 80px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.06);
      position: relative;
    }
    .window .drag-top,
    .window .titlebar-align {
      height: 40px;
    }
    .traffic {
      position: absolute;
      top: 14px;
      left: 16px;
      z-index: 40;
      display: flex;
      gap: 8px;
      pointer-events: none;
    }
    .traffic i {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: block;
    }
    .traffic .r { background: #ff5f57; }
    .traffic .y { background: #febc2e; }
    .traffic .g { background: #28c840; }
    .avatar.has-face img {
      width: 100%;
      height: 100%;
      display: block;
    }
    .hash-face {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #3a3a3c;
      color: #f0f0f0;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 650;
    }
    .thread { -webkit-mask-image: none; mask-image: none; }
    .modal {
      position: absolute;
    }
    /* A screenshot is taken at load, before the open animation would end. */
    .modal.open, .modal.open > .dialog { animation: none; }
    textarea.textin { resize: none; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="window">
      <div class="traffic"><i class="r"></i><i class="y"></i><i class="g"></i></div>
      <div class="app">
        <aside>
          <div class="drag-top"></div>
          <div class="search-row">
            <input class="search" placeholder="검색" value="" readonly />
            <button class="icon-btn" type="button" aria-label="추가">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 12h14" />
                <path d="M12 5v14" />
              </svg>
            </button>
          </div>
          <div class="rail-lists">
            <div class="rail-section grouped">
              <div class="group-head">
                <button class="group-toggle" type="button">
                  <svg class="group-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m6 9 6 6 6-6" />
                  </svg>
                </button>
                <button class="group-name" type="button">팀</button>
              </div>
              <button class="rail-row active" type="button">
                <span class="avatar has-face"><img src="face-teardrop.svg" alt="" /></span>
                <span class="rail-row-text">
                  <span class="agent-name">
                    <span class="agent-name-label"><span class="agent-name-text">Grok</span></span>
                    <time class="rail-stamp">오후 2:22</time>
                  </span>
                  <span class="agent-preview">README 설치 섹션, clone 빌드랑 cargo install --git 둘 다 넣을까?</span>
                </span>
              </button>
              <button class="rail-row unread" type="button">
                <span class="avatar has-face"><img src="face-square.svg" alt="" /></span>
                <span class="rail-row-text">
                  <span class="agent-name">
                    <span class="agent-name-label"><span class="agent-name-text">Claude</span></span>
                    <time class="rail-stamp">오후 1:04</time>
                  </span>
                  <span class="agent-preview">한 단락으로 줄이자.</span>
                </span>
                <span class="unread-dot"></span>
              </button>
              <button class="rail-row" type="button">
                <span class="avatar has-face"><img src="face-circle.svg" alt="" /></span>
                <span class="rail-row-text">
                  <span class="agent-name">
                    <span class="agent-name-label"><span class="agent-name-text">Codex</span></span>
                    <time class="rail-stamp">10. 21.</time>
                  </span>
                  <span class="agent-preview">테스트 세 개 더 넣었어.</span>
                </span>
              </button>
            </div>
          </div>
          <div class="rail-foot">
            <button class="icon-btn" type="button" title="설정" aria-label="설정">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </aside>
        <main>
          <div class="titlebar-align"></div>
          <div class="update-banner-slot"></div>
          <div class="conn-banner-slot"></div>
          <header>
            <div class="head-identity">
              <button class="who-btn" type="button" style="--who-color:#ff6a00">
                <span class="avatar who-avatar has-face"><img src="face-teardrop.svg" alt="" /></span>
                <span class="who-name">Grok</span>
              </button>
              <span class="head-run" title="Grok · grok-4 · 생각 기본">Grok · grok-4 · 생각 기본</span>
            </div>
            <button type="button" class="head-action" title="봇 설정 ⌘⇧R" aria-label="봇 설정">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10" />
                <path d="M12 16v-4" />
                <path d="M12 8h.01" />
              </svg>
            </button>
          </header>
          <div class="thread-wrap">
            <div class="thread">
              <div class="row me">
                <div class="me-msg">
                  <div class="bubble-row">
                    <div class="bubble md"><p>README 설치 섹션, clone 빌드랑 cargo install --git 둘 다 넣을까?</p></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <form class="composer">
            <div class="composer-box">
              <div class="composer-row">
                <button type="button" class="attach-btn" aria-label="추가">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M5 12h14" />
                    <path d="M12 5v14" />
                  </svg>
                </button>
                <div class="composer-input is-empty" data-placeholder="Grok에게 메시지 (@이름으로 부르기)"></div>
                <button type="submit" aria-label="보내기" disabled>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m5 12 7-7 7 7" />
                    <path d="M12 19V5" />
                  </svg>
                </button>
              </div>
            </div>
          </form>
        </main>
      </div>
      <div class="modal open">
        <div class="dialog">
          <h3>새 봇</h3>
          <div class="form-stack">
            <div class="info-hero">
              <span class="avatar new-avatar has-face">
                <img src="face-triangle.svg" alt="" />
              </span>
            </div>
            <div class="field-block">
              <label class="field" for="new-name">이름</label>
              <input id="new-name" class="textin" value="리뷰어" readonly />
            </div>
            <div class="field-block">
              <label class="field" for="new-persona">역할 / 설명</label>
              <textarea id="new-persona" class="textin" readonly>패치를 짧게 리뷰하고, 막히는 지점만 짚는다.</textarea>
            </div>
            <div class="field-block">
              <label class="field">AI</label>
              <div class="model-pick">
                <button type="button" class="textin model-pick-hit" aria-expanded="false">
                  <span class="model-pick-name">Claude · sonnet</span>
                  <span class="model-pick-meta">생각 보통</span>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m6 9 6 6 6-6" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
          <div class="actions spread">
            <button type="button" class="ghost">취소</button>
            <button type="button" class="primary">만들기</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
