<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Crew — 루틴</title>
  <link rel="stylesheet" href="../../crates/crew/ui/src/styles.css" />
  <style>
    html, body {
      margin: 0;
      width: 1280px;
      height: 1000px;
      overflow: hidden;
      background:
        radial-gradient(ellipse 50% 60% at 20% 40%, rgba(255, 90, 90, 0.14), transparent 60%),
        radial-gradient(ellipse 40% 50% at 80% 70%, rgba(155, 125, 255, 0.12), transparent 55%),
        #12151f;
    }
    .stage {
      width: 1280px;
      height: 1000px;
      display: grid;
      place-items: center;
    }
    .window {
      width: 1120px;
      height: 880px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow:
        0 40px 80px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.06);
      position: relative;
    }
    .window .drag-top,
    .window .titlebar-align {
      height: 40px;
    }
    .traffic {
      position: absolute;
      top: 14px;
      left: 16px;
      z-index: 40;
      display: flex;
      gap: 8px;
      pointer-events: none;
    }
    .traffic i {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: block;
    }
    .traffic .r { background: #ff5f57; }
    .traffic .y { background: #febc2e; }
    .traffic .g { background: #28c840; }
    .avatar.has-face img {
      width: 100%;
      height: 100%;
      display: block;
    }
    .hash-face {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #3a3a3c;
      color: #f0f0f0;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 650;
    }
    .thread {
      -webkit-mask-image: none;
      mask-image: none;
      max-width: calc(100% - 420px);
    }
    .sheet { animation: none; }
    .overlay.open { animation: none; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="window">
      <div class="traffic"><i class="r"></i><i class="y"></i><i class="g"></i></div>
      <div class="app">
        <aside>
          <div class="drag-top"></div>
          <div class="search-row">
            <input class="search" placeholder="검색" value="" readonly />
            <button class="icon-btn" type="button" aria-label="추가">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 12h14" />
                <path d="M12 5v14" />
              </svg>
            </button>
          </div>
          <div class="rail-lists">
            <div class="rail-section grouped">
              <div class="group-head">
                <button class="group-toggle" type="button">
                  <svg class="group-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m6 9 6 6 6-6" />
                  </svg>
                </button>
                <button class="group-name" type="button">팀</button>
              </div>
              <button class="rail-row active" type="button">
                <span class="avatar has-face"><img src="face-teardrop.svg" alt="" /></span>
                <span class="rail-row-text">
                  <span class="agent-name">
                    <span class="agent-name-label"><span class="agent-name-text">Grok</span></span>
                    <time class="rail-stamp">오전 8:01</time>
                  </span>
                  <span class="agent-preview">알겠어요, 다시 켤 때까지 쉴게요.</span>
                </span>
              </button>
              <button class="rail-row" type="button">
                <span class="avatar has-face"><img src="face-square.svg" alt="" /></span>
                <span class="rail-row-text">
                  <span class="agent-name">
                    <span class="agent-name-label"><span class="agent-name-text">Claude</span></span>
                    <time class="rail-stamp">10. 21.</time>
                  </span>
                  <span class="agent-preview">한 단락으로 줄이자.</span>
                </span>
              </button>
              <button class="rail-row" type="button">
                <span class="avatar has-face"><img src="face-circle.svg" alt="" /></span>
                <span class="rail-row-text">
                  <span class="agent-name">
                    <span class="agent-name-label"><span class="agent-name-text">Codex</span></span>
                    <time class="rail-stamp">10. 21.</time>
                  </span>
                  <span class="agent-preview">테스트 세 개 더 넣었어.</span>
                </span>
              </button>
            </div>
          </div>
          <div class="rail-foot">
            <button class="icon-btn" type="button" title="설정" aria-label="설정">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </aside>
        <main>
          <div class="titlebar-align"></div>
          <div class="update-banner-slot"></div>
          <div class="conn-banner-slot"></div>
          <header>
            <div class="head-identity">
              <button class="who-btn" type="button" style="--who-color:#ff6a00">
                <span class="avatar who-avatar has-face"><img src="face-teardrop.svg" alt="" /></span>
                <span class="who-name">Grok</span>
              </button>
              <span class="head-run" title="Grok · grok-4 · 생각 기본">Grok · grok-4 · 생각 기본</span>
            </div>
            <button type="button" class="head-action" title="봇 설정 ⌘⇧R" aria-label="봇 설정">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10" />
                <path d="M12 16v-4" />
                <path d="M12 8h.01" />
              </svg>
            </button>
          </header>
          <div class="thread-wrap">
            <div class="thread">
              <time class="thread-time">오전 8:01</time>
              <div class="row me">
                <div class="me-msg">
                  <div class="bubble-row">
                    <div class="bubble md"><p>평일 8시마다 할 일 브리핑해줘</p></div>
                  </div>
                </div>
              </div>
              <div class="row them incoming">
                <span class="avatar msg-avatar has-face"><img src="face-teardrop.svg" alt="" /></span>
                <div class="channel-msg">
                  <div class="channel-who" style="color:#ff6a00">Grok</div>
                  <div class="bubble-row">
                    <div class="bubble md incoming"><p>평일 오전 8:00로 등록했어요. 첫 실행은 내일이에요.</p></div>
                  </div>
                </div>
              </div>
              <div class="sys-note">‘주간 리뷰’ 루틴을 껐습니다.</div>
              <div class="row them incoming">
                <span class="avatar msg-avatar has-face"><img src="face-teardrop.svg" alt="" /></span>
                <div class="channel-msg">
                  <div class="channel-who" style="color:#ff6a00">Grok</div>
                  <div class="bubble-row">
                    <div class="bubble md incoming"><p>알겠어요, 다시 켤 때까지 쉴게요.</p></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <form class="composer">
            <div class="composer-box">
              <div class="composer-row">
                <button type="button" class="attach-btn" aria-label="추가">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M5 12h14" />
                    <path d="M12 5v14" />
                  </svg>
                </button>
                <div class="composer-input is-empty" data-placeholder="Grok에게 메시지 (@이름으로 부르기)"></div>
                <button type="submit" aria-label="보내기" disabled>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m5 12 7-7 7 7" />
                    <path d="M12 19V5" />
                  </svg>
                </button>
              </div>
            </div>
          </form>
          <div class="overlay open">
            <div class="sheet agent-sheet">
              <div class="sheet-head">
                <h3>Grok</h3>
                <button type="button" class="sheet-close" aria-label="닫기">
                  <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                  </svg>
                </button>
              </div>
              <div class="pane-tabs" role="tablist">
                <button type="button" role="tab">봇 정보</button>
                <button type="button" role="tab" class="on" aria-selected="true">루틴</button>
                <button type="button" role="tab">메모리</button>
              </div>
              <div class="sheet-body">
                <div class="form-stack">
                  <div class="pane-block">
                    <div class="pane-label">등록된 루틴</div>
                    <div class="routine-list">
                      <div class="routine">
                        <div class="routine-text">
                          <div class="routine-name">아침 브리핑</div>
                          <div class="routine-meta">평일 오전 8:00</div>
                          <div class="routine-prompt">오늘 할 일을 정리해서 알려줘</div>
                        </div>
                        <input type="checkbox" role="switch" class="switch" aria-label="아침 브리핑" checked />
                      </div>
                      <div class="routine">
                        <div class="routine-text">
                          <div class="routine-name">월초 정산</div>
                          <div class="routine-meta">cron 0 9 1 * *</div>
                          <div class="routine-prompt">지난달 지출 내역을 표로 정리해줘</div>
                        </div>
                        <input type="checkbox" role="switch" class="switch" aria-label="월초 정산" checked />
                      </div>
                      <div class="routine is-off">
                        <div class="routine-text">
                          <div class="routine-name">주간 리뷰</div>
                          <div class="routine-meta">매주 금요일 오후 5:00</div>
                          <div class="routine-prompt">이번 주 한 일을 짧게 정리해줘</div>
                        </div>
                        <input type="checkbox" role="switch" class="switch" aria-label="주간 리뷰" />
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
</body>
</html>
