<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Crew</title>
  <!-- A screenshot of the real app on demo data (crates/crew/ui/readme.html),
       in a window frame. render.sh passes ?img=<png>&h=<height>. -->
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse 50% 60% at 20% 40%, rgba(255, 90, 90, 0.14), transparent 60%),
        radial-gradient(ellipse 40% 50% at 80% 70%, rgba(155, 125, 255, 0.12), transparent 55%),
        #12151f;
    }
    .stage {
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
    }
    .window {
      position: relative;
      width: 1120px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow:
        0 40px 80px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.06);
    }
    img {
      display: block;
      width: 100%;
      height: 100%;
    }
    .traffic {
      position: absolute;
      top: 14px;
      left: 16px;
      display: flex;
      gap: 8px;
      pointer-events: none;
    }
    .traffic i {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="window" id="window">
      <img id="app" alt="" />
      <div class="traffic"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
    </div>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    document.getElementById("window").style.height = (q.get("h") || "740") + "px";
    document.getElementById("app").src = q.get("img");
  </script>
</body>
</html>
