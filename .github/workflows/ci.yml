name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui:
    name: UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/crew/ui/package-lock.json

      - name: Install JS deps
        run: npm ci
        working-directory: crates/crew/ui

      - name: Unit tests
        run: npm test
        working-directory: crates/crew/ui

      - name: Release script tests
        run: node --test scripts/*.test.mjs

      # The validator only ran at tag-push time, which finds a mismatch after
      # the tag is published — and recovering means deleting and re-pushing a
      # tag the release job then refuses as an existing asset set.
      - name: Version manifests agree
        run: node scripts/validate-release-version.mjs --assert-consistent

      - name: Typecheck + production bundle
        run: npm run build
        working-directory: crates/crew/ui

  rust:
    name: Rust
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/crew/ui/package-lock.json

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Test
        run: cargo test --locked -p crew
